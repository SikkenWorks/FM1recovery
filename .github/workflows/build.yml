name: Build FM1 Recovery

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source
        uses: actions/checkout@v7

      - name: Compile Windows application
        shell: pwsh
        run: |
          $compiler = Join-Path $env:WINDIR "Microsoft.NET\Framework64\v4.0.30319\csc.exe"

          if (!(Test-Path $compiler)) {
            throw ".NET Framework C# compiler not found."
          }

          New-Item -ItemType Directory -Path dist -Force | Out-Null

          $compilerArguments = @(
            "/nologo"
            "/target:winexe"
            "/platform:x64"
            "/optimize+"
            "/reference:System.Windows.Forms.dll"
            "/reference:System.Drawing.dll"
            "/reference:System.IO.Compression.dll"
            "/reference:System.IO.Compression.FileSystem.dll"
            "/win32manifest:app.manifest"
            "/win32icon:app.ico"
            "/resource:app.ico,branding.ico"
            "/resource:payload.zip,payload.zip"
            "/resource:THIRD_PARTY_NOTICES.txt,THIRD_PARTY_NOTICES.txt"
            "/out:dist/FM1-Recovery-by-SikkenWorks.exe"
            "RecoveryApp.cs"
          )

          & $compiler @compilerArguments

          if ($LASTEXITCODE -ne 0) {
            throw "Compilation failed."
          }

          Copy-Item README.md, THIRD_PARTY_NOTICES.txt -Destination dist

      - name: Upload compiled application
        uses: actions/upload-artifact@v7
        with:
          name: FM1-Recovery-Windows
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Attach compiled files to release
    if: github.event_name == 'release'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download compiled application from this run
        uses: actions/download-artifact@v7
        with:
          name: FM1-Recovery-Windows
          path: dist

      - name: Upload compiled files to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $files = @(Get-ChildItem -Path dist -File | ForEach-Object { $_.FullName })
          if ($files.Count -eq 0) {
            throw "No compiled files found in dist."
          }
          gh release upload "$env:RELEASE_TAG" @files --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Uploading release files failed."
          }
